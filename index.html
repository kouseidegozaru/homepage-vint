<!doctype html>

<body>

  <!-- 飾り罫（名刺のロゴ上下の装飾） -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="flourish" viewBox="0 0 240 32">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <g id="flourish-half">
          <path d="M128 20 H146 C156 20 160 10 170 10 C180 10 184 20 178 25 C173 29 166 25 169 20"/>
          <path d="M170 10 C186 4 200 8 208 14 C214 19 222 20 234 16"/>
          <path d="M204 12 C208 6 216 6 216 12"/>

        <use href="#flourish-half" transform="translate(240 0) scale(-1 1)"/>

      <path d="M120 6 L125 14 L120 22 L115 14 Z" fill="currentColor"/>
      <circle cx="120" cy="2.5" r="1.8" fill="currentColor"/>

  <header class="site-header">

  <main id="top">

      <div class="wrap">

            <svg class="flourish" viewBox="0 0 240 32" aria-hidden="true"><use href="#flourish"/></svg>

            <svg class="flourish flourish--bottom" viewBox="0 0 240 32" aria-hidden="true"><use href="#flourish"/></svg>

          <span class="hero-rule" aria-hidden="true"></span>

          <div class="hero-copy">
            <p class="hero-lead">指先から、<br>あなたらしい色を。</p>

                Instagramを見る

              <a class="btn btn--ghost" href="#access">アクセス</a>

          </div>
        </div>

      <p class="signature" aria-hidden="true">Miho Chikuni</p>
